<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rumble Train — Supabase connection test</title>
  <style>
    body {
      font: 16px system-ui, sans-serif;
      max-width: 750px;
      margin: 50px auto;
      padding: 20px;
      line-height: 1.6;
    }
    li { margin: 12px 0; }
    button { padding: 10px 18px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Supabase reference data test</h1>
  <p>This page reads your three reference tables directly.
     It does not change any data.</p>

  <button id="test">Test connection</button>
  <ul id="results" aria-live="polite"></ul>

  <script type="module">
    const SUPABASE_URL =
      'https://dahuwcfrwkshtkjxudij.supabase.co';

    const PUBLISHABLE_KEY =
      'sb_publishable_xZaw1wxRCmMrQDo5Cojz3Q_FhUuDUFX';

    const tables = [
      ['roster_rules', 31],
      ['skill_lists', 72],
      ['base_positions', 163]
    ];

    const button = document.querySelector('#test');
    const results = document.querySelector('#results');

    async function testConnection() {
      button.disabled = true;
      results.replaceChildren();

      try {
        await Promise.all(tables.map(async ([table, expected]) => {
          const item = document.createElement('li');
          item.textContent = `${table}: checking…`;
          results.append(item);

          const started = performance.now();

          try {
            const response = await fetch(
              `${SUPABASE_URL}/rest/v1/${table}?select=*&limit=1000`,
              {
                headers: { apikey: PUBLISHABLE_KEY },
                cache: 'no-store',
                signal: AbortSignal.timeout(20000)
              }
            );

            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }

            const rows = await response.json();

            if (!Array.isArray(rows)) {
              throw new Error('Unexpected response');
            }

            const seconds =
              ((performance.now() - started) / 1000).toFixed(2);

            item.textContent =
              `${table}: ${rows.length} rows in ${seconds}s — ` +
              (rows.length === expected
                ? 'PASS'
                : `expected ${expected}; check the data`);
          } catch (error) {
            item.textContent = `${table}: FAILED — ${error.message}`;
          }
        }));
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener('click', testConnection);
    testConnection();
  </script>
</body>
</html>
