<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach Portal Guide | Blood Bowl League</title>

  <!-- COACH PORTAL STYLING -->
  <link rel="stylesheet" href="coach-portal.css?v=16">

  <style>
    /* =========================
       COACH GUIDE PAGE
       ========================= */

    body { margin:0; background:#101010; color:#eee; }

    .guide-page { max-width:1100px; margin:0 auto; padding:24px 18px 50px; }

    .guide-header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:20px; padding:20px 24px; background:#1b1b1b; border:1px solid #333; border-radius:14px; }

    .guide-header h1 { margin:0; font-size:28px; }

    .guide-header p { margin:5px 0 0; color:#aaa; }

    .guide-back { display:inline-block; padding:10px 18px; border-radius:8px; background:#333; color:#fff; text-decoration:none; font-weight:700; white-space:nowrap; }

    .guide-back:hover { background:#444; }

    .guide-frame-wrap { overflow:hidden; background:#fff; border-radius:14px; border:1px solid #333; min-height:1000px; }

    .guide-frame { display:block; width:100%; height:1100px; border:0; background:#fff; }

    @media (max-width:700px) {
      .guide-page { padding:12px; }
      .guide-header { align-items:flex-start; flex-direction:column; padding:16px; }
      .guide-header h1 { font-size:23px; }
      .guide-frame { height:1200px; }
    }
  </style>
</head>

<body>

  <main class="guide-page">

    <!-- =========================
         GUIDE HEADER
         ========================= -->
    <section class="guide-header">
      <div>
        <h1>Coach Portal Guide</h1>
        <p>New Coach Guide to managing your Blood Bowl league team.</p>
      </div>

      <a href="index.html" class="guide-back">← Back to Coach Portal</a>

    <!-- =========================
         GOOGLE DOC GUIDE

        title="Blood Bowl Coach Portal Guide">

    </section>
