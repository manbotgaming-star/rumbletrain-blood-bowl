<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach Portal Guide | Blood Bowl League</title>

  <!-- COACH PORTAL STYLING -->
  <link rel="stylesheet" href="coach-portal.css?v=16">

  <style>
    /* =========================
       COACH GUIDE PAGE
       ========================= */
  
    body { margin:0; background:#e9eef0; color:#173d4d; }
  
    .guide-page { width:min(calc(100% - 32px),1380px); margin:0 auto; padding:34px 0 60px; }
  
    .guide-header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:16px; padding:18px 22px; background:linear-gradient(105deg,#102f3c 0%,#194b5d 55%,#0c2631 100%); border:1px solid #0a2630; border-radius:12px; box-shadow:0 8px 26px rgba(0,0,0,.12); color:#fff; }
  
    .guide-header h1 { margin:0 0 4px; color:#fff; font-size:28px; text-transform:uppercase; }
  
    .guide-header p { margin:0; color:#d8e5e9; font-size:13px; }
  
    .guide-back { display:inline-block; padding:9px 15px; border:1px solid rgba(255,255,255,.58); border-radius:6px; background:rgba(255,255,255,.10); color:#fff; text-decoration:none; font-weight:700; text-transform:uppercase; white-space:nowrap; }
  
    .guide-back:hover { background:rgba(255,255,255,.20); }
  
    .guide-frame-wrap { overflow:hidden; background:#fff; border:1px solid #aab7bc; border-radius:12px; box-shadow:0 4px 16px rgba(0,0,0,.08); }
  
    .guide-frame { display:block; width:100%; height:1450px; border:0; background:#fff; }
  
    @media (max-width:700px) {
      .guide-page { width:calc(100% - 18px); padding:12px 0 30px; }
      .guide-header { align-items:flex-start; flex-direction:column; padding:16px; }
      .guide-header h1 { font-size:23px; }
      .guide-back { width:100%; text-align:center; }
      .guide-frame { height:1500px; }
    }
  </style>
</head>

<body>

  <main class="guide-page">

    <!-- =========================
         GUIDE HEADER
         ========================= -->
    <section class="guide-header">
      <div>
        <h1>Coach Portal Guide</h1>
        <p>New Coach Guide to managing your Blood Bowl league team.</p>
      </div>

      <a href="index.html" class="guide-back">← Back to Coach Portal</a>
    </section>


    <!-- =========================
         GOOGLE DOC GUIDE
         Replace YOUR-PUBLISHED-GOOGLE-DOC-URL below
         ========================= -->
    <section class="guide-frame-wrap">
      <iframe
        class="guide-frame"
        src="https://docs.google.com/document/d/e/2PACX-1vTdaWDmkDzYVnL6lBO6emCGQqtIl_TNIuoe5zmgGt3dlSqvY0KiEIVxIYYhXRS7htmJ4i3GvolaeMLq/pub?embedded=true"
        title="Blood Bowl Coach Portal Guide">
      </iframe>
    </section>

  </main>

</body>
</html>
