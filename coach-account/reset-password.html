<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Reset Password | Rumble Train</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf2f3;color:#193b47;font:16px system-ui,sans-serif}
main{max-width:500px;margin:50px auto;padding:24px;background:white;border-radius:10px}
label{display:block;margin:16px 0 6px}
input,button{font:inherit;padding:10px;border:1px solid #a2b3ba;border-radius:5px}
input{width:100%}
button{margin:16px 0;background:#193f4e;color:white;cursor:pointer}
button:disabled{opacity:.6}
#message{overflow-wrap:anywhere}
@media(max-width:540px){main{margin:20px 12px}}
</style>
</head>
<body>
<main>
<h1>Reset your password</h1>
<p id="message" role="status" aria-live="polite">Checking your reset link…</p>

<form id="reset-form" hidden>
  <label for="new-password">New password — at least 12 characters</label>
  <input id="new-password" type="password" autocomplete="new-password" minlength="12" required>
  <label for="confirm-password">Confirm new password</label>
  <input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required>
  <button id="save-password" type="submit">Save new password</button>
</form>

<p><a href="./">Return to coach sign-in</a></p>
<noscript>JavaScript is required to reset your password.</noscript>
</main>
<script type="module" src="./reset-password.js?v=1"></script>
</body>
</html>
